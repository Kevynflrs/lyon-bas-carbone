name: Déploiement (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://huggingface.co/datasets/${{ vars.HF_DATASET_REPO }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configuration de production présente
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_DATASET_REPO" ]; then
            echo "::error::HF_TOKEN ou HF_DATASET_REPO manquant"; exit 1
          fi

      # Exactement ce que le cron exécutera : si ça passe ici, la collecte planifiée fonctionnera.
      - name: Smoke test - collecte réelle en production
        run: python -m pipeline.ingest.velov status

  # Le déploiement du site React (GitHub Pages) s'ajoutera ici à la V1.
