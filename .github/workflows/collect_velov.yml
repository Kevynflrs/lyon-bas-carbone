name: Collecte Vélo'v

on:
  # Déclencheur principal : un planificateur externe (cron-job.org) appelle l'API GitHub
  # toutes les 15 minutes. Le cron GitHub seul n'est pas fiable : en cas de forte charge,
  # les exécutions planifiées sont retardées ou abandonnées (4 à 5 collectes par jour
  # observées au lieu de 96 en novembre 2026).
  workflow_dispatch:
  # Filet de sécurité si le planificateur externe tombe : une collecte par heure au minimum.
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: collect-velov
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instantané des disponibilités
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.ingest.velov status

      - name: Instantané pour le site web (JSON public)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.export.snapshot
