name: Collecte Vélo'v

on:
  schedule:
    # Toutes les 15 min, décalé du début d'heure (moins de retards côté GitHub).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

permissions:
  contents: read

concurrency:
  group: collect-velov
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instantané des disponibilités
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.ingest.velov status

      - name: Instantané pour le site web (JSON public)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.export.snapshot
